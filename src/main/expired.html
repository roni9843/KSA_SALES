<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>License Expired</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .contact-info {
            margin-top: 30px;
            font-size: 0.9em;
            color: #555;
        }
        .contact-info a {
            color: #3498db;
            text-decoration: none;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>License Expired!</h1>
        <p>Your free trial period has ended, or your subscription has expired.</p>
        <p>To continue using Moto POS, please purchase a license or renew your subscription.</p>
        <div class="contact-info">
            <p>For licensing inquiries, please contact us at:</p>
            <p>Email: <a href="mailto:support@motopos.com">support@motopos.com</a></p>
            <p>Phone: +1 (123) 456-7890</p>
        </div>
    </div>
</body>
</html>
